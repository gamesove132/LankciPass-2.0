# LankciPassCore - seasons.yml
# Опис сезонів: оформлення, рівні, умови та нагороди. Стан запусків (дати, прогрес) зберігається в SQLite.
# Тривалість сезону за замовчуванням - 30 днів (duration-days). Реальні дати початку/завершення задаються
# запуском сезону й командами /lankcipass season setdays | setend | duration.
#
# Умова рівня (requirement):
#   type: POINTS        - очки сезону (1 жетон = 1 очко за налаштуванням tokens.points-per-token)
#   type: PLAYER_LEVEL  - ванільний рівень досвіду (сумісність зі старим меню)
# Нагорода (reward.commands) виконується від консолі, {player} - нік гравця. Мітка команди перевіряється
# заздалегідь (rewards.precheck-commands). Рівнів може бути скільки завгодно (меню показує 15 слотів).
#
# bootstrap - порядок сезонів при першому запуску: перший стає активним, решта - запланованими.

bootstrap: [season1, season2, season3]

seasons:
