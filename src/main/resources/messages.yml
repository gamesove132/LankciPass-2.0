# LankciPassCore - messages.yml
# Кольори: &a, &b..., hex: &#RRGGBB. Плейсхолдери {назва} підставляє плагін; {prefix} - префікс.
# Якщо ключа немає в цьому файлі, береться типове значення з плагіна (у консолі буде попередження лише для зовсім відсутніх ключів).

prefix: "&d&lLANKCIPASS &8» "

kind:
  daily: "звичайний квест"
  mega: "мега-квест"

common:
  error: "{prefix}&cСталася внутрішня помилка. Повідомте адміністрацію (деталі в консолі)."
  no-permission: "{prefix}&cУ вас немає прав на цю дію."
  not-ready: "{prefix}&cLankciPass ще завантажується або вимкнений. Спробуйте за мить."
  players-only: "{prefix}&cЦя команда доступна лише гравцям."
  player-not-found: "{prefix}&cГравця &f{name} &cне знайдено (він має хоча б раз зайти на сервер із LankciPass)."
  unknown-command: "{prefix}&cНевідома підкоманда. Список: &f/lankcipass help"
  unknown-mode: "{prefix}&cНевідомий режим: &f{mode}"

menu:
  unknown: "{prefix}&cНевідоме меню. Доступні: &f{menus}"
  fallback:
    - "&8&m                                        "
    - "&d&lLANKCIPASS &8| {season}"
    - "&7До завершення: {timer}"
    - "&7Жетони: &6{tokens} &8| &7Очки сезону: &b{points}"
    - "&7Отримано нагород: &a{claimed}&7/&f{levels}"
    - "&8Меню недоступне (немає DeluxeMenus або PlaceholderAPI) - використовуйте команди: &f/lankcipass help"
    - "&8&m                                        "

balance:
  self: "{prefix}&7Ваші жетони: &6{tokens} &8| &7очки сезону: &b{points}"

help:
  player:
    - "&d&lLankciPass &8- &7команди"
    - "&f/lankcipass &8- &7відкрити головне меню"
    - "&f/lankcipass menu <main|quests|mega|seasons|shop> &8- &7відкрити меню"
    - "&f/lankcipass balance &8- &7ваші жетони й очки"
    - "&f/lankcipass claim <рівень> &8- &7забрати нагороду рівня"
  admin:
    - "&d&lАдміністрування"
    - "&f/lankcipass tokens <гравець> <кількість|give|take|set|check> [кількість]"
    - "&f/lankcipass quest reset <гравець> [режим] &8| &f/lankcipass quest rotate [режим|all] [daily|mega|all]"
    - "&f/lankcipass season info|list|start|setdays|setend|restore|duration|create|archive|schedule"
    - "&f/lankcipass admin &8- &7меню керування сезонами"
    - "&f/lankcipass reload &8| &f/lankcipass debug &8| &f/lankcipass confirm &8| &f/lankcipass cancel"

usage:
  claim: "{prefix}&cВикористання: &f/lankcipass claim <номер рівня>"
  view: "{prefix}&cВикористання: &f/lankcipass view <режим>"
  shop: "{prefix}&cВикористання: &f/lankcipass shop buy <номер товару>"
  quest: "{prefix}&cВикористання: &f/lankcipass quest <claim|reset|rotate> ..."
  quest-claim: "{prefix}&cВикористання: &f/lankcipass quest claim <daily|mega> <номер>"
  quest-reset: "{prefix}&cВикористання: &f/lankcipass quest reset <гравець> [режим]"
  quest-rotate: "{prefix}&cВикористання: &f/lankcipass quest rotate [режим|all] [daily|mega|all]"
  tokens: "{prefix}&cВикористання: &f/lankcipass tokens <гравець> <±кількість | give|take|set <кількість> | check>"
  season: "{prefix}&cВикористання: &f/lankcipass season <info|list|start|setdays|setend|restore|duration|create|archive|schedule> ..."
  season-start: "{prefix}&cВикористання: &f/lankcipass season start <id> [new|reset|restore] [днів]"
  season-setdays: "{prefix}&cВикористання: &f/lankcipass season setdays <днів до завершення>"
  season-setend: "{prefix}&cВикористання: &f/lankcipass season setend <рррр-мм-дд|дд.мм.рррр> <гг:хх>"
  season-duration: "{prefix}&cВикористання: &f/lankcipass season duration <днів> [id запланованого сезону]"
  season-create: "{prefix}&cВикористання: &f/lankcipass season create <id> &7(латиниця, цифри, _ та -)"

confirm:
  header: "{prefix}&e&lПОТРІБНЕ ПІДТВЕРДЖЕННЯ"
  how: "{prefix}&7Щоб виконати - введіть &a/lankcipass confirm &7(протягом {seconds} с). Скасувати: &c/lankcipass cancel"
  none: "{prefix}&7Немає операції, що очікує підтвердження."
  cancelled: "{prefix}&7Операцію скасовано."
  warn:
    start-new:
      - "&7Запуск сезону {name} &7як &fновий незалежний запуск&7."
      - "&7Поточний сезон ({active}&7, залишилось {left}) буде &cзавершено достроково&7, його можна відновити."
      - "&7Прогрес нового запуску - з нуля. Нагороди, отримані в цьому сезоні раніше, &cповторно не видаються&7."
      - "&8Перед змінами автоматично створюється резервна копія бази."
    start-reset:
      - "&7Запуск сезону {name} &7із &cповним скиданням&7."
      - "&7Поточний сезон ({active}&7, залишилось {left}) буде &cзавершено достроково&7."
      - "&7Прогрес - з нуля, а нагороди цього сезону гравці зможуть &cотримати знову&7."
      - "&8Перед змінами автоматично створюється резервна копія бази."
    restore:
      - "&7Відновлення сезону {name} &7зі збереженим прогресом і отриманими нагородами."
      - "&7Поточний сезон ({active}&7, залишилось {left}) буде &cзавершено достроково&7."
      - "&8Перед змінами автоматично створюється резервна копія бази."
    archive:
      - "&7Архівація сезону &f{id}&7: його не можна буде запланувати чи запустити, лише відновити."
      - "&7Історія та прогрес гравців зберігаються."
    setend:
      - "&7Нова дата завершення активного сезону: &f{value}"
      - "&7Прогрес гравців не змінюється. Заплановані сезони пересуваються слідом."
    setdays:
      - "&7До завершення активного сезону залишиться рівно &f{value} дн.&7 від цього моменту."
      - "&7Прогрес гравців не змінюється. Заплановані сезони пересуваються слідом."
    duration:
      - "&7Нова тривалість сезону: &f{value} дн.&7 (рахується від початку запуску)."
      - "&7Прогрес гравців не змінюється. Заплановані сезони пересуваються слідом."
    quest-reset:
      - "&7Скидання прогресу квестів гравця &f{player}&7 (режим: &f{mode}&7) у поточних циклах."
      - "&7Виконані квести знову стануть доступними, нагороду за них можна буде отримати повторно."
    quest-rotate:
      - "&7Негайна заміна квестів (нові цикли) для вибраних режимів."
      - "&cПрогрес гравців у поточних циклах буде втрачено."

reload:
  done: "{prefix}&aКонфігурацію перезавантажено."
  problems: "{prefix}&eЗнайдено проблем у конфігурації: &f{count}"
  more: "&8... та ще {count} (див. &f/lankcipass debug &8і консоль)"

tokens:
  done: "{prefix}&7Баланс гравця &f{player}&7: &6{tokens} &7жетонів."
  check: "{prefix}&7Баланс гравця &f{player}&7: &6{tokens} &7жетонів."
  too-large: "{prefix}&cЗначення завелике. Максимум: &f{max}"
  negative: "{prefix}&cДля give/take/set потрібне невід'ємне число."

pvp:
  reward: "{prefix}&7Вбивство &f{victim}&7: &6+{tokens} жетонів &8(баланс {balance})"
  rejected:
    mode: "{prefix}&8Нагороду за вбивство не видано: світ не належить жодному режиму."
    world: "{prefix}&8Нагороду за вбивство не видано: гравці в різних світах."
    gamemode: "{prefix}&8Нагороду за вбивство не видано: творчий режим або спостерігач."
    ip: "{prefix}&8Нагороду за вбивство не видано: однакова IP-адреса."
    fresh: "{prefix}&8Нагороду за вбивство не видано: жертва щойно зайшла."
    duplicate: "{prefix}&8Нагороду за це вбивство вже враховано."
    cooldown: "{prefix}&8Нагороду за вбивство не видано: цього гравця вже вбивали нещодавно."
    victim-limit: "{prefix}&8Нагороду за вбивство не видано: досягнуто ліміт на цього гравця за добу."
    day-limit: "{prefix}&8Нагороду за вбивство не видано: досягнуто добовий ліміт нагород за PvP."

quest:
  completed: "{prefix}&a&lКвест виконано! &f{name} &8({difficulty}&8, {kind})"
  reward-received: "{prefix}&7Отримано &6{tokens} жетонів &8(баланс {balance})"
  ready-to-claim: "{prefix}&eНагороду можна забрати в меню квестів."
  new-daily: "{prefix}&bДоступні нові звичайні квести! &8({mode}&8) &7Відкрийте &f/lankcipass menu quests"
  new-mega: "{prefix}&dДоступні нові мега-квести! &8({mode}&8) &7Відкрийте &f/lankcipass menu mega"
  claim:
    already: "{prefix}&cНагороду за цей квест уже отримано."
    not-ready: "{prefix}&cКвест ще не виконано."
    expired: "{prefix}&cЦикл квестів завершився - нагороду вже не отримати."
    none: "{prefix}&cТакого квесту зараз немає."
  reset:
    done: "{prefix}&aПрогрес квестів гравця &f{player}&a скинуто (записів: {count})."
  rotate:
    done: "{prefix}&aСтворено нових циклів квестів: &f{count}"

reward:
  claimed: "{prefix}&a&lНагороду рівня {level} отримано! &8({name}&8)"
  already: "{prefix}&cНагороду рівня {level} уже отримано."
  locked: "{prefix}&cРівень {level} ще не розблоковано."
  no-season: "{prefix}&cЗараз немає активного сезону - нагороду отримати не можна."
  no-level: "{prefix}&cТакого рівня немає."
  no-profile: "{prefix}&cВаш профіль ще не завантажено. Перезайдіть або спробуйте за мить."
  bad-config: "{prefix}&cНагорода налаштована некоректно. Повідомте адміністрацію - нічого не списано."
  error: "{prefix}&cНе вдалося видати нагороду. Спробуйте ще раз."

shop:
  bought: "{prefix}&aКуплено: &f{name} &8(-{price} жетонів)"
  no-funds: "{prefix}&cНедостатньо жетонів. Потрібно: &6{price}"
  no-item: "{prefix}&cТакого товару немає."
  bad-config: "{prefix}&cТовар налаштований некоректно. Повідомте адміністрацію - жетони не списано."
  error: "{prefix}&cНе вдалося виконати покупку."
  refunded: "{prefix}&eНе вдалося видати товар - жетони повернено."

season:
  broadcast:
    ended: "{prefix}&7Сезон {name} &7завершено! Дякуємо за гру."
    started: "{prefix}&aПочався сезон {name}&a! &7Завершення: &f{end}"
  info:
    none: "{prefix}&cЗараз немає активного сезону."
    active: "{prefix}&7Активний: {name} &8(запуск #{run}, {mode}, нагороди: {policy})&7\n&7Початок: &f{start} &8| &7Кінець: &f{end} &8| &7Залишилось: {timer}"
    scheduled: "{prefix}&7Заплановано: {name} &8(#{run}) &7{start} &8→ &7{end}"
    def: "{prefix}&7Сезон {name} &8(id {id}, №{number}) &7рівнів: &f{levels}&7, тривалість: &f{days} дн.&7, статус: &f{state}"
    run: "&8  - запуск #{run} &7{status} &8({mode}) &7{start} → {end} &8відновлень: {restored}, причина завершення: {reason}"
  list:
    header: "{prefix}&7Сезони (з seasons.yml):"
    entry: "&8 - {name} &8[{id}, №{number}] &7{state} &8| рівнів {levels}, {days} дн."
  ok:
    started: "{prefix}&aСезон &f{id}&a запущено (запуск #{run}, {mode}). Завершення: &f{end}"
    restored: "{prefix}&aСезон &f{id}&a відновлено (запуск #{run}). Завершення: &f{end}"
    setend: "{prefix}&aНову дату завершення встановлено: &f{end} &7(залишилось {left})"
    duration: "{prefix}&aТривалість змінено: &f{days} дн.&a, завершення: &f{end}"
    archived: "{prefix}&aСезон &f{id}&a архівовано."
    scheduled: "{prefix}&aСезон &f{id}&a додано в чергу. Початок: &f{start}"
    created: "{prefix}&aСезон &f{id}&a створено (№{number}) із шаблоном на 15 рівнів у seasons.yml. Відредагуйте файл і виконайте &f/lankcipass reload"
  err:
    unknown: "{prefix}&cСезону &f{id}&c немає в seasons.yml."
    archived: "{prefix}&cСезон &f{id}&c в архіві. Спершу відновіть його: &f/lankcipass season restore {id}"
    days: "{prefix}&cКількість днів має бути від 1 до 3650."
    endpast: "{prefix}&cДата завершення має бути в майбутньому."
    noactive: "{prefix}&cНемає активного сезону."
    durationpast: "{prefix}&cЗ такою тривалістю сезон завершився б у минулому."
    alreadyactive: "{prefix}&cСезон &f{id}&c уже активний."
    alreadyscheduled: "{prefix}&cСезон &f{id}&c уже активний або в черзі."
    archiveactive: "{prefix}&cАктивний сезон &f{id}&c не можна архівувати. Спершу запустіть інший."
    norun: "{prefix}&cУ сезону &f{id}&c ще не було запусків - нічого відновлювати. Використайте &f/lankcipass season start {id}"
    nothingscheduled: "{prefix}&cСезон &f{id}&c не активний і не запланований."
    badid: "{prefix}&cId сезону: 2-32 символи, лише a-z, 0-9, _ та -."
    exists: "{prefix}&cСезон &f{id}&c уже існує."
    io: "{prefix}&cНе вдалося записати seasons.yml: {error}"
