# LankciPassCore - shop.yml: магазин жетонів (до 14 товарів, меню lankcipass_shop).
# price - ціна в жетонах; commands - команди консолі при покупці ({player}). Якщо жодна команда не виконалась - жетони повертаються.
# Назви/лор можна з кольорами. Приклади нижче - вважайте їх шаблоном і змініть під свій сервер.

items:
  diamonds:
    name: "&b16 Алмазів"
    price: 1500
    icon: DIAMOND
    lore: ["&7Корисний ресурс для крафту", "&7та покращень спорядження."]
    commands: ["give {player} minecraft:diamond 16"]
  golden_apples:
    name: "&68 Золотих яблук"
    price: 800
    icon: GOLDEN_APPLE
    lore: ["&7Запас здоров'я для", "&7довгих вилазок."]
    commands: ["give {player} minecraft:golden_apple 8"]
  xp_bottles:
    name: "&a64 Пляшечки досвіду"
    price: 1200
    icon: EXPERIENCE_BOTTLE
    lore: ["&7Досвід для чарування", "&7та ремонту."]
    commands: ["give {player} minecraft:experience_bottle 64"]
  netherite_scrap:
    name: "&84 Незеритові уламки"
    price: 4000
    icon: NETHERITE_SCRAP
    lore: ["&7Для кування", "&7незеритового спорядження."]
    commands: ["give {player} minecraft:netherite_scrap 4"]
  totem:
    name: "&eТотем безсмертя"
    price: 3000
    icon: TOTEM_OF_UNDYING
    lore: ["&7Другий шанс у складній битві."]
    commands: ["give {player} minecraft:totem_of_undying 1"]
  elytra:
    name: "&bЕлітри"
    price: 12000
    icon: ELYTRA
    lore: ["&7Політ над світом LankciWorld."]
    commands: ["give {player} minecraft:elytra 1"]
