# LankciPassCore - quests.yml
# Квести розділені за режимами (modes.<id>) - прогрес одного режиму не зараховується в іншому.
# Id режимів мають збігатися з config.yml (modes). Нагорода (reward) - жетони.
#
# Типи: KILL_MOB, KILL_UNIQUE_MOB, KILL_PLAYER, BREAK_BLOCK, FISH, CRAFT_ITEM, PLAY_MINUTES, COMPLETE_QUESTS
#   entities  - фільтр видів мобів (порожньо = будь-які); materials - фільтр блоків/предметів.
#   bonus-commands - необов'язкові команди консолі при отриманні нагороди ({player}).
# Склад циклу: settings.<daily|mega>.pick - скільки квестів кожної складності випадково вибирається.
# Скільки показує GUI: до 6 звичайних і до 6 мега-квестів на режим.
#
# Файл можна змінювати; після змін: /lankcipass reload (нові квести з'являться в наступному циклі,
# або /lankcipass quest rotate для негайної заміни).

settings:
  daily:
    period-hours: 24
    pick: {EASY: 1, MEDIUM: 1, HARD: 1, EXTREME: 1}
  mega:
    period-hours: 72
    pick: {MEGA: 3}

difficulties:
  EASY:    {name: "Легкий",        color: "&a", icon: LIME_DYE}
  MEDIUM:  {name: "Середній",      color: "&e", icon: YELLOW_DYE}
  HARD:    {name: "Важкий",        color: "&6", icon: ORANGE_DYE}
  EXTREME: {name: "Екстремальний", color: "&c", icon: RED_DYE}
  MEGA:    {name: "Мега",          color: "&d", icon: MAGENTA_DYE}

